<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0b10" />
    <title>Sauce Clicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <h1>Sauce&nbsp;Clicker</h1>
          <p class="sub">A tiny testbed for the Sauce Games SDK.</p>
        </div>
        <button
          id="sound-toggle"
          class="icon-btn"
          type="button"
          aria-pressed="false"
          title="Toggle sound"
        >
          <span class="icon-on" aria-hidden="true">🔊</span>
          <span class="icon-off" aria-hidden="true">🔇</span>
          <span class="visually-hidden">Toggle sound</span>
        </button>
      </header>

      <section class="stage" aria-label="Game">
        <div class="hud">
          <div class="stat">
            <span class="label">Score</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">Best</span>
            <span id="best" class="value muted-value">—</span>
          </div>
          <div class="stat">
            <span class="label">Clicks/s</span>
            <span id="cps" class="value muted-value">0.0</span>
          </div>
          <div class="stat stat-time">
            <span class="label">Time</span>
            <span id="time" class="value">30</span>
          </div>
        </div>

        <div class="progress" role="presentation">
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div class="clicker-wrap">
          <button id="clicker" class="clicker" type="button">Start</button>
          <div id="fx" class="fx" aria-hidden="true"></div>
          <div id="ready-overlay" class="ready-overlay" hidden aria-hidden="true">
            <span id="ready-count" class="ready-count">3</span>
          </div>
        </div>

        <p id="hint" class="hint" aria-live="polite">
          Click Start to begin a 30-second round.
        </p>
      </section>

      <section class="leaderboard" aria-label="Leaderboard">
        <div class="lb-head">
          <h2>Top 10</h2>
          <button id="refresh-btn" type="button" class="ghost">Refresh</button>
        </div>
        <ol id="leaderboard-list" class="lb-list">
          <li class="empty">Loading…</li>
        </ol>
      </section>

    </main>

    <!-- End-of-round result modal -->
    <dialog id="result-modal" class="modal" aria-labelledby="modal-title">
      <form method="dialog" class="modal-card">
        <button
          id="modal-dismiss"
          class="modal-close"
          type="button"
          aria-label="Close"
          title="Close"
        >
          ✕
        </button>

        <p class="modal-kicker">Time's up!</p>
        <h2 id="modal-title" class="visually-hidden">Round results</h2>
        <div class="final">
          <span id="final-score" class="final-score">0</span>
          <span class="final-label">points</span>
        </div>
        <p id="result-detail" class="result-detail"></p>

        <div id="submit-fields" class="submit-fields">
          <label for="player-name">Enter your name for the leaderboard</label>
          <input
            id="player-name"
            name="player-name"
            type="text"
            maxlength="24"
            placeholder="Your display name"
            autocomplete="off"
            inputmode="text"
          />
          <div class="row">
            <button id="submit-btn" type="submit" class="primary">Submit score</button>
            <button id="replay-btn" type="button" class="ghost">Play again</button>
          </div>
        </div>

        <p id="submit-msg" class="msg" aria-live="polite"></p>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
