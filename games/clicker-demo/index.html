<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sauce Clicker — Demo</title>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>Sauce Clicker</h1>
        <p class="sub">A tiny testbed for the Sauce Games SDK.</p>
      </header>

      <section class="stage">
        <div class="hud">
          <div class="stat">
            <span class="label">Score</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">Time</span>
            <span id="time" class="value">30</span>
          </div>
        </div>

        <button id="clicker" class="clicker" type="button">Start</button>
        <p id="hint" class="hint">Click Start to begin a 30-second round.</p>

        <!-- Score submission, shown when a round ends -->
        <form id="submit-form" class="submit-form" hidden>
          <p class="result" id="result"></p>
          <label for="player-name">Your name</label>
          <input
            id="player-name"
            name="player-name"
            type="text"
            maxlength="24"
            placeholder="Enter a display name"
            autocomplete="off"
          />
          <div class="row">
            <button id="submit-btn" type="submit">Submit score</button>
            <button id="replay-btn" type="button" class="ghost">Play again</button>
          </div>
          <p id="submit-msg" class="msg" aria-live="polite"></p>
        </form>
      </section>

      <section class="leaderboard">
        <div class="lb-head">
          <h2>Top 10</h2>
          <button id="refresh-btn" type="button" class="ghost">Refresh</button>
        </div>
        <ol id="leaderboard-list" class="lb-list">
          <li class="empty">Loading…</li>
        </ol>
      </section>

      <footer class="footer">
        <span id="conn" class="conn"></span>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
