<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sauce Clicker thumbnail</title>
  <desc id="desc">A bright pink and purple clicker button on a dark Sauce Games background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#36295f"/>
      <stop offset="65%" stop-color="#111226"/>
      <stop offset="100%" stop-color="#080912"/>
    </radialGradient>
    <radialGradient id="button" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8ab0"/>
      <stop offset="48%" stop-color="#ff5c8a"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="200" cy="160" r="84" fill="#ff5c8a" opacity="0.14"/>
  <circle cx="1030" cy="500" r="130" fill="#6c5ce7" opacity="0.16"/>
  <circle cx="600" cy="330" r="185" fill="#6c5ce7" opacity="0.28" filter="url(#glow)"/>
  <circle cx="600" cy="330" r="155" fill="url(#button)" filter="url(#glow)"/>
  <circle cx="552" cy="280" r="38" fill="#ffffff" opacity="0.24"/>
  <text x="600" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#ffffff">CLICK!</text>
  <text x="600" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#ffffff">Sauce Clicker</text>
  <text x="600" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#b8bee4">Leaderboard + analytics SDK test</text>
</svg>
