name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs;
# we want a deployment to finish even if a follow-up push has landed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Build the in-repo Sauce Clicker and nest it under the storefront's
      # Pages site at /play/clicker-demo/ so it ships from this single repo
      # (no separate deploy). Its vite base is "./" so it works under a sub-path.
      - name: Install clicker dependencies
        run: npm ci
        working-directory: games/clicker-demo

      - name: Build clicker
        run: npm run build
        working-directory: games/clicker-demo

      - name: Stage clicker into Pages output
        run: |
          mkdir -p dist/play/clicker-demo
          cp -r games/clicker-demo/dist/. dist/play/clicker-demo/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
